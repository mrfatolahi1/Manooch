venue: BINANCE
enabled: true

endpoints:
  ws:
    SPOT: "wss://stream.binance.com:9443/stream"
  rest:
    PERP_LINEAR: "https://fapi.binance.com"

rate_limit:
  rest_weight_per_minute: 2400
  max_weight_fraction: 0.5
  ws_connect_per_5min: 300
  ws_connect_fraction: 0.5
  subscriptions_per_connection: 200

connection:
  max_streams_per_socket: 100
  ping_interval: 20s
  pong_timeout: 10s
  read_timeout: 60s

quirks:
  timestamp_unit: ms               # ms|us|ns|s

symbol_overrides:
  BTC_USDT: BTCUSDT

instruments:
  - market_type: PERP_LINEAR
    channels: [mark_price, index_price, funding]
    symbols: [BTC_USDT, ETH_USDT]
