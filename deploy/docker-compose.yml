# `docker compose up` from the repository root brings up everything:
#
#   docker compose -f deploy/docker-compose.yml up
#
# Adding a venue is one service block here, one file in config/venues/, and one
# adapter package. Nothing else.

services:
  redis:
    image: redis:8-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      # Loopback only: exposed so manooch-tap and manooch-status can be run
      # from the host, not so anything else can reach it.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  feed-binance:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # --synthetic until the first adapter lands in M1. Without it the process
    # starts, proves it can reach Redis, and idles.
    command: ["--exchange=BINANCE", "--config=/etc/manooch", "--synthetic"]
    volumes:
      - ../config:/etc/manooch:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9101/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    mem_limit: 512m
    restart: unless-stopped
