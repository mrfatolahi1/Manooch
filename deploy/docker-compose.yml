# Adding a venue is one service block here, one file in config/venues/ and one
# adapter package.

services:
  redis:
    image: redis:8-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      # Loopback only: for manooch-tap and manooch-status on the host.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  feed-binance:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["--exchange=BINANCE", "--config=/etc/manooch"]
    volumes:
      - ../config:/etc/manooch:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9101/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    mem_limit: 512m
    restart: unless-stopped
