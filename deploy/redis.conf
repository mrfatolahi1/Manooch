# Every value here is load-bearing. See docs/deploy.md for the reasoning.

# Data is ephemeral: the cache rebuilds from the venue within one cadence.
appendonly no
save ""

maxmemory 2gb

# Critical. Any eviction policy would silently delete last-value keys under
# memory pressure, and a missing key is how a stale stream is reported — a
# working stream would read as expired. noeviction returns a write error, which
# the publisher counts and logs.
maxmemory-policy noeviction

# Expired-key events; the REST fallback in M2 is triggered by them.
notify-keyspace-events Ex

# The default 32mb/8mb/60 is crossed by a book firehose, and Redis drops an
# over-budget subscriber with no notice to either side. Raising it makes that
# rarer, not impossible: consumers still have to watch publish_seq.
client-output-buffer-limit pubsub 256mb 64mb 60
