# Redis for Manooch. Every value here is load-bearing.

# All data is ephemeral by design: the last-value cache is rebuilt from the
# venue within one cadence of a restart. Persistence would buy nothing and cost
# fsync latency on the publish path.
appendonly no
save ""

maxmemory 2gb

# Critical. Under any eviction policy Redis would quietly delete last-value
# cache keys when memory got tight, and a key that is missing is how Manooch
# says "this stream is stale". A healthy stream would report as expired, with
# nothing anywhere saying why.
#
# Under noeviction a full instance returns write errors instead. Manooch counts
# them, logs them and degrades the stream. Loud failure over silent corruption.
maxmemory-policy noeviction

# Expired-key events drive the REST fallback in M2: the key going away is the
# trigger to start polling.
notify-keyspace-events Ex

# The default pubsub buffer limit is 32mb hard / 8mb soft over 60s, which a
# book firehose crosses. A subscriber that exceeds it is disconnected by Redis
# without notice to either side — exactly the silent drop that publish_seq
# exists to expose. Raising the limit makes it rarer; it does not make it
# impossible, so consumers must still watch publish_seq.
client-output-buffer-limit pubsub 256mb 64mb 60
